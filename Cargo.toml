[package]
name = "rio"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.98"
argh = { git = "https://github.com/google/argh.git", rev = "39b3091d52d90edff365ed9f23711888d9b47854" }
# Adds 100s of KB to the binary: clap = { version = "4.5.43", features = ["derive"] }
# Adds about 1 MB to the binary: env_logger = "0.11.8"
log = "0.4.27"
postcard = { version = "1.1.3", features = ["use-std"] }
serde = "1.0.219"
wasm-encoder = "0.236.0"

[profile.release]
# Got smaller with s than z in a quick check.
opt-level = "s"
strip = true

[profile.release-lto]
inherits = "release"
lto = true
panic = "abort"
