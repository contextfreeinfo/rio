# Tests on every push and pull request; a tag like v0.1.0 also builds release binaries and publishes
# them as a GitHub release.
name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  sanitize:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Build with ASan and UBSan
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DRIO_SANITIZE=ON -DCMAKE_C_COMPILER=${{ matrix.cc }}
          cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fuzz the compiler for a minute
        run: |
          clang -g -O1 -fsanitize=fuzzer,address,undefined -fno-sanitize-recover=all -Isrc src/rio.c src/aot.c tests/fuzz.c -o fuzz
          mkdir -p corpus seed
          cp tests/*.rio bench/*.rio $(find tests/modules -name '*.rio') seed/
          ./fuzz -dict=tests/fuzz.dict -max_total_time=60 -max_len=4096 corpus seed
      - name: VM and generated C agree on random programs
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target rio
          python3 tests/difftest.py build/rio gcc 300 ${{ github.run_number }}
      - name: Keep what the fuzzer found
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-findings
          path: |
            difftest-fail-*
            crash-*
            leak-*
            timeout-*
            oom-*

  build-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, sanitize, fuzz]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            flags: -DCMAKE_EXE_LINKER_FLAGS=-static
          - os: macos-latest
            name: macos-universal
            flags: -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          - os: windows-latest
            name: windows-x86_64
            flags: -DCMAKE_POLICY_DEFAULT_CMP0091=NEW -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: bash
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.flags }}
          cmake --build build --config Release --target rio
      - name: Package
        shell: bash
        run: |
          dir="rio-${GITHUB_REF_NAME}-${{ matrix.name }}"
          mkdir -p "$dir"
          if [ -f build/Release/rio.exe ]; then cp build/Release/rio.exe "$dir/"; else cp build/rio "$dir/"; fi
          cp LICENSE README.md "$dir/"
          if [ "${{ runner.os }}" = "Windows" ]; then 7z a "$dir.zip" "$dir" > /dev/null; else tar czf "$dir.tar.gz" "$dir"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: rio-*.*

  release:
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
